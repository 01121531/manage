name: Security Gate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24ea975727876cf496b1eb0c5b36e96e01600b51 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@24ea975727876cf496b1eb0c5b36e96e01600b51 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"

  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r platform/requirements.txt pip-audit

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Verify release manifest
        run: python scripts/verify_release_manifest.py

      - name: Verify signoff template
        run: python scripts/verify_signoff_template.py

      - name: Python dependency audit
        run: pip-audit -r platform/requirements.txt

      - name: Python test dependency audit
        run: pip-audit -r platform/requirements-test.txt

      - name: Python desktop build dependency audit
        run: pip-audit -r requirements-desktop-build.txt

      - name: Frontend dependency audit
        working-directory: frontend
        run: >-
          npm audit --audit-level=high
          --include=prod --include=dev --include=optional --include=peer

  container-supply-chain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/Dockerfile
          - name: web
            dockerfile: infra/frontend.Dockerfile
          - name: edge
            dockerfile: infra/edge.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build local scan candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: local/email-platform-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=security-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=security-${{ matrix.name }}

      - name: Prepare supply-chain evidence directory
        run: mkdir -p supply-chain

      - name: Generate Syft SPDX SBOM
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: local/email-platform-${{ matrix.name }}:${{ github.sha }}
          format: spdx-json
          output-file: supply-chain/${{ matrix.name }}.spdx.json
          artifact-name: container-sbom-${{ matrix.name }}.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - name: Trivy HIGH/CRITICAL image gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/email-platform-${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: supply-chain/${{ matrix.name }}.trivy.sarif
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true

      - name: Summarize Trivy findings
        if: always()
        run: python scripts/report_trivy_sarif.py supply-chain/${{ matrix.name }}.trivy.sarif

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-trivy-${{ matrix.name }}
          path: supply-chain/${{ matrix.name }}.trivy.sarif
          if-no-files-found: error
          retention-days: 30
