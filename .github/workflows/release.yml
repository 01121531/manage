name: Release Windows desktop and platform containers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-quality-gate:
    needs: release-postgres-migration-gate
    runs-on: windows-latest
    env:
      PHASE6_EVIDENCE_OUTPUT: ${{ runner.temp }}/phase6-ci-rehearsal-${{ github.sha }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/requirements.txt
            platform/requirements-test.txt
            requirements-desktop-build.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned dependencies
        run: >-
          python -m pip install
          -r platform/requirements-test.txt
          -r requirements-desktop-build.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify tag matches the application version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $declared = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          if ($version -ne $declared.Trim()) {
            throw "Tag version $version does not match app_version.py ($declared)."
          }

      - name: Run full quality gate
        shell: pwsh
        run: ./scripts/quality_gate.ps1

      - name: Upload Phase 6 CI rehearsal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phase6-ci-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/phase6-ci-rehearsal-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 90

  release-postgres-migration-gate:
    runs-on: ubuntu-24.04
    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://migration_gate:migration_gate@localhost:5432/email_platform_migration_gate
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: email_platform_migration_gate
          POSTGRES_USER: migration_gate
          POSTGRES_PASSWORD: migration_gate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_gate -d email_platform_migration_gate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install platform dependencies
        run: python -m pip install -r platform/requirements.txt

      - name: Verify Vault token file safety on Linux
        run: python -m unittest platform.tests.test_secret_resolvers tests.test_vault_token_sinks tests.test_vault_approle_bootstrap tests.test_vault_broker_policy_bootstrap

      - name: Verify private materialization and Kubernetes TLS boundaries on Linux
        run: >-
          python -m unittest tests.test_private_secret_materialization
          tests.test_private_secret_residue
          tests.test_kubernetes_kubeconfig_intake
          tests.test_kubernetes_tls_rotation_backend
          tests.test_tls_rotation_profile_live
          tests.test_verify_tls_rotation_executor
          tests.test_verify_tls_rotation_artifacts
          tests.test_private_secret_crash_evidence
          tests.test_verify_private_secret_crash_evidence
          tests.test_private_secret_github_attestation
          tests.test_private_secret_target_provenance
          tests.test_verify_private_secret_provenance
          tests.test_private_secret_github_rest_collection
          tests.test_private_secret_worm_collection
          tests.test_verify_private_secret_collection
          tests.test_private_secret_collection_review_decision
          tests.test_verify_private_secret_collection_review
          tests.test_private_secret_collection_archive_receipt
          tests.test_verify_private_secret_collection_archive
          tests.test_private_secret_collector_deployment
          tests.test_verify_private_secret_collector_deployment

      - name: Apply PostgreSQL migrations online
        run: alembic -c alembic.ini upgrade head

      - name: Verify unique repository head matches database
        shell: python
        run: |
          import os
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text

          heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads()
          if len(heads) != 1:
              raise SystemExit(f"expected exactly one Alembic head, found {heads}")
          engine = create_engine(os.environ["ALEMBIC_DATABASE_URL"])
          with engine.connect() as connection:
              database_head = connection.execute(
                  text("SELECT version_num FROM alembic_version")
              ).scalar_one()
          engine.dispose()
          if database_head != heads[0]:
              raise SystemExit(
                  f"database head {database_head!r} does not match repository head {heads[0]!r}"
              )
          print(f"postgres-migration-gate-ok head={database_head}")

  release-codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24ea975727876cf496b1eb0c5b36e96e01600b51 # v4.37.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@24ea975727876cf496b1eb0c5b36e96e01600b51 # v4.37.0
        with:
          category: "/language:${{ matrix.language }}"

  release-security-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependency auditor
        run: python -m pip install pip-audit

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Secret scan
        run: python scripts/secret_scan.py

      - name: Python dependency audit
        run: pip-audit -r platform/requirements.txt

      - name: Python test dependency audit
        run: pip-audit -r platform/requirements-test.txt

      - name: Python desktop build dependency audit
        run: pip-audit -r requirements-desktop-build.txt

      - name: Frontend dependency audit
        working-directory: frontend
        run: >-
          npm audit --audit-level=high
          --include=prod --include=dev --include=optional --include=peer

  release-browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r platform/requirements.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: frontend
        run: npm run test:e2e

  verified-container-release:
    needs:
      - release-quality-gate
      - release-browser-e2e
      - release-codeql
      - release-security-gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: infra/Dockerfile
          - name: web
            dockerfile: infra/frontend.Dockerfile
          - name: edge
            dockerfile: infra/edge.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set immutable image coordinates
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repository}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "candidate=local/email-platform-${{ matrix.name }}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build local release candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.image.outputs.candidate }}
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

      - name: Prepare supply-chain evidence directory
        run: mkdir -p supply-chain

      - name: Generate Syft SPDX SBOM
        uses: anchore/sbom-action@28d71544de8eaf1b958d335707167c5f783590ad # v0.22.2
        with:
          image: ${{ steps.image.outputs.candidate }}
          format: spdx-json
          output-file: supply-chain/${{ matrix.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Trivy HIGH/CRITICAL release gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.candidate }}
          format: sarif
          output: supply-chain/${{ matrix.name }}.trivy.sarif
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true

      - name: Summarize Trivy findings
        if: always()
        run: python scripts/report_trivy_sarif.py supply-chain/${{ matrix.name }}.trivy.sarif

      - name: Login to GitHub Container Registry after scan
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned staging digest
        id: push
        shell: bash
        env:
          CANDIDATE: ${{ steps.image.outputs.candidate }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          staging_ref="$IMAGE:sha-${GITHUB_SHA}"
          docker tag "$CANDIDATE" "$staging_ref"
          docker push "$staging_ref"
          digest_ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$staging_ref")"
          digest="${digest_ref#*@}"
          if [[ "$digest_ref" != "$IMAGE@$digest" || ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid pushed image digest: $digest" >&2
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keyless-sign image and attach Syft SBOM
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          image_digest="${IMAGE}@${DIGEST}"
          cosign sign --yes \
            --bundle "supply-chain/${{ matrix.name }}.cosign.bundle.json" \
            --output-payload "supply-chain/${{ matrix.name }}.cosign.payload.json" \
            "$image_digest"
          cosign attest --yes --type spdxjson --predicate "supply-chain/${{ matrix.name }}.spdx.json" "$image_digest"

      - name: Attach GitHub build provenance
        id: github_provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Capture raw provider evidence before promotion
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          GITHUB_PROVENANCE_BUNDLE: ${{ steps.github_provenance.outputs.bundle-path }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          test -n "$GITHUB_PROVENANCE_BUNDLE"
          cp -- "$GITHUB_PROVENANCE_BUNDLE" "supply-chain/${{ matrix.name }}.github-provenance.bundle.jsonl"
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" \
            > "supply-chain/${{ matrix.name }}.oci-manifest.raw.json"
          manifest_sha="$(sha256sum "supply-chain/${{ matrix.name }}.oci-manifest.raw.json" | cut -d ' ' -f 1)"
          if [[ "sha256:${manifest_sha}" != "$DIGEST" ]]; then
            echo "Raw OCI manifest bytes do not match the pushed digest" >&2
            exit 1
          fi
          cosign_path="$(command -v cosign)"
          sha256sum "$cosign_path" > "supply-chain/${{ matrix.name }}.cosign.executable.sha256"
          cosign version --json > "supply-chain/${{ matrix.name }}.cosign.version.json"
          gh_path="$(command -v gh)"
          sha256sum "$gh_path" > "supply-chain/${{ matrix.name }}.github.executable.sha256"
          gh version > "supply-chain/${{ matrix.name }}.github.version.txt"
          gh attestation trusted-root \
            > "supply-chain/${{ matrix.name }}.github-sigstore.trusted-root.jsonl"
          if gh attestation trusted-root --verify-only \
            > "supply-chain/${{ matrix.name }}.tuf.verify.txt" 2>&1; then
            printf 'exit_code=0\n' >> "supply-chain/${{ matrix.name }}.tuf.verify.txt"
          else
            cat "supply-chain/${{ matrix.name }}.tuf.verify.txt" >&2
            exit 1
          fi

      - name: Verify keyless image signature and SBOM attestation
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          image_digest="${IMAGE}@${DIGEST}"
          cosign verify-blob \
            --bundle "supply-chain/${{ matrix.name }}.cosign.bundle.json" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "supply-chain/${{ matrix.name }}.cosign.payload.json" \
            > "supply-chain/${{ matrix.name }}.cosign.bundle.verify.txt"
          cosign verify --output json \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$image_digest" | tee "supply-chain/${{ matrix.name }}.cosign.verify.json"
          cosign verify-attestation --output json \
            --type spdxjson \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$image_digest" | tee "supply-chain/${{ matrix.name }}.cosign.verify-attestation.json"
          gh attestation verify "oci://${image_digest}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "supply-chain/${{ matrix.name }}.github-provenance.bundle.jsonl" \
            --custom-trusted-root "supply-chain/${{ matrix.name }}.github-sigstore.trusted-root.jsonl" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --format json \
            > "supply-chain/${{ matrix.name }}.github.verify.json"

      - name: Build caller-pinnable external evidence index
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          python scripts/create_runtime_attestation_external_evidence_index.py \
            --evidence-dir supply-chain \
            --output "supply-chain/${{ matrix.name }}.runtime-attestation.external-evidence-index.json" \
            --name "${{ matrix.name }}" \
            --image "$IMAGE" \
            --digest "$DIGEST" \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$GITHUB_REPOSITORY_ID" \
            --owner-id "$GITHUB_REPOSITORY_OWNER_ID" \
            --workflow-ref "$GITHUB_WORKFLOW_REF" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --captured-at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Publish verified release tag
        shell: bash
        env:
          CANDIDATE: ${{ steps.image.outputs.candidate }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          release_ref="${IMAGE}:${GITHUB_REF_NAME}"
          set +e
          existing_output="$(docker buildx imagetools inspect "$release_ref" 2>&1)"
          inspect_status=$?
          set -e
          existing_digest=""
          if [[ $inspect_status -eq 0 ]]; then
            existing_digest="$(printf '%s\n' "$existing_output" | sed -nE 's/^Digest:[[:space:]]+(sha256:[0-9a-f]{64})$/\1/p' | head -n 1)"
            if [[ -z "$existing_digest" || "$existing_digest" != "$DIGEST" ]]; then
              echo "Existing release tag is ambiguous or points to another digest" >&2
              exit 1
            fi
          elif ! grep -Eqi 'manifest unknown|not found' <<<"$existing_output"; then
            echo "Cannot safely determine whether the release tag already exists" >&2
            exit 1
          fi
          docker tag "$CANDIDATE" "$release_ref"
          push_output="$(docker push "$release_ref")"
          printf '%s\n' "$push_output"
          published_digest="$(printf '%s\n' "$push_output" | sed -nE 's/^digest: (sha256:[0-9a-f]{64}) size:.*$/\1/p' | tail -n 1)"
          if [[ "$published_digest" != "$DIGEST" ]]; then
            echo "Published release tag digest does not match verified digest" >&2
            exit 1
          fi

      - name: Record immutable container evidence
        shell: bash
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          sbom="supply-chain/${{ matrix.name }}.spdx.json"
          sbom_sha="$(sha256sum "$sbom" | cut -d ' ' -f 1)"
          trivy="supply-chain/${{ matrix.name }}.trivy.sarif"
          trivy_sha="$(sha256sum "$trivy" | cut -d ' ' -f 1)"
          identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          jq -n \
            --arg name "${{ matrix.name }}" \
            --arg image "$IMAGE" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg commit "$GITHUB_SHA" \
            --arg digest "$DIGEST" \
            --arg sbom_file "${{ matrix.name }}.spdx.json" \
            --arg sbom_sha256 "$sbom_sha" \
            --arg trivy_file "${{ matrix.name }}.trivy.sarif" \
            --arg trivy_sha256 "$trivy_sha" \
            --arg issuer "https://token.actions.githubusercontent.com" \
            --arg identity "$identity" \
            '{schema_version: 1, name: $name, image: $image, tag: $tag, commit: $commit, digest: $digest, sbom: {file: $sbom_file, sha256: $sbom_sha256}, scan: {tool: "trivy", severities: ["HIGH", "CRITICAL"], result: "passed", file: $trivy_file, sha256: $trivy_sha256}, signature: {issuer: $issuer, identity: $identity}, attestations: ["cosign-spdxjson", "github-build-provenance"]}' \
            > "supply-chain/${{ matrix.name }}.metadata.json"

      - name: Upload signed container release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-release-${{ matrix.name }}
          path: supply-chain/
          if-no-files-found: error
          retention-days: 90

  verified-windows-release:
    needs:
      - release-quality-gate
      - release-browser-e2e
      - release-codeql
      - release-security-gate
      - verified-container-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/requirements.txt
            requirements-desktop-build.txt

      - name: Install platform and pinned desktop build dependencies
        run: >-
          python -m pip install
          -r platform/requirements.txt
          -r requirements-desktop-build.txt

      - name: Download verified container evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: container-release-*
          path: release/assets/supply-chain
          merge-multiple: true

      - name: Download Phase 6 CI rehearsal evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phase6-ci-rehearsal-${{ github.sha }}
          path: release/assets

      - name: Verify Phase 6 evidence commit and integrity
        shell: pwsh
        run: |
          $evidence = "release/assets/phase6-ci-rehearsal.json"
          python scripts/phase6_rehearsal.py verify `
            --input $evidence `
            --expected-commit "${{ github.sha }}"
          if ($LASTEXITCODE -ne 0) { throw "Phase 6 evidence verification failed." }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $evidence).Hash.ToLowerInvariant()
          "$digest  phase6-ci-rehearsal.json" | Set-Content `
            -LiteralPath "release/assets/phase6-ci-rehearsal.json.sha256" `
            -Encoding ascii

      - name: Create immutable container release manifest
        shell: pwsh
        run: >-
          python scripts/create_container_release_manifest.py
          --input-dir release/assets/supply-chain
          --tag "${{ github.ref_name }}"
          --commit "${{ github.sha }}"
          --output release/assets/container-release-manifest.json

      - name: Build and inspect platform-only Windows EXE
        shell: pwsh
        run: ./build.ps1

      - name: Create verified update assets
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $source = Get-ChildItem -LiteralPath release/windows -Filter *.exe
          if ($source.Count -ne 1) { throw "Expected exactly one Windows EXE." }
          New-Item -ItemType Directory -Force -Path release/assets | Out-Null
          $asset = "release/assets/email-platform-windows.exe"
          Copy-Item -LiteralPath $source[0].FullName -Destination $asset
          python scripts/verify_desktop_package.py --exe $asset
          python scripts/create_update_manifest.py `
            --exe $asset `
            --version $version `
            --repository "${{ github.repository }}" `
            --output release/assets/update-manifest.json

      - name: Publish GitHub Release after container verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
