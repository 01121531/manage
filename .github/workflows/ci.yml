name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r platform/requirements-test.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run quality gate
        shell: pwsh
        run: ./scripts/quality_gate.ps1

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r platform/requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E
        working-directory: frontend
        run: npm run test:e2e

  windows-desktop-release:
    runs-on: windows-latest
    needs: quality-gate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            platform/requirements.txt
            requirements-desktop-build.txt

      - name: Install platform and pinned desktop build dependencies
        run: >-
          python -m pip install
          -r platform/requirements.txt
          -r requirements-desktop-build.txt

      - name: Build and inspect platform-only Windows EXE
        shell: pwsh
        run: ./build.ps1

      - name: Verify release artifact and SHA-256 manifest
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath release/windows -Filter *.exe
          if ($exe.Count -ne 1) { throw "Expected exactly one Windows EXE artifact." }
          python scripts/verify_desktop_package.py --exe $exe[0].FullName
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe[0].FullName).Hash.ToLowerInvariant()
          $manifest = (Get-Content -LiteralPath "$($exe[0].FullName).sha256" -Raw).Trim()
          if (-not $manifest.StartsWith($actual)) { throw "SHA-256 manifest mismatch." }

      - name: Upload verified Windows release
        uses: actions/upload-artifact@v4
        with:
          name: email-platform-windows-${{ github.sha }}
          path: release/windows/*
          if-no-files-found: error
          retention-days: 14
