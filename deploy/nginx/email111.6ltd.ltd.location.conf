# Paste this block into the reverse-proxy configuration for
# email111.6ltd.ltd after the proxy egress IP has been allowed by the
# upstream Vercel project.  Without that allow-listing Vercel currently
# returns `X-Vercel-Mitigated: deny` before the mail application is reached.

location ^~ / {
    proxy_pass https://mail.054120.xyz;
    proxy_http_version 1.1;

    # Send the upstream hostname during the TLS handshake and verify its
    # certificate.  BaoTa installations on CentOS/RHEL/AlmaLinux normally
    # use the path below.  Run deploy/find-ca-bundle.sh on the server and
    # replace this path if it reports a different file.
    proxy_ssl_server_name on;
    proxy_ssl_name mail.054120.xyz;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;

    proxy_set_header Host mail.054120.xyz;
    proxy_set_header Origin https://mail.054120.xyz;
    proxy_set_header Referer https://mail.054120.xyz/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_redirect https://mail.054120.xyz/ https://email111.6ltd.ltd/;
    proxy_cookie_domain mail.054120.xyz email111.6ltd.ltd;

    # Mail responses can contain credentials, messages, and verification
    # codes.  Never cache them and never ignore upstream privacy headers.
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    proxy_connect_timeout 15s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}A
