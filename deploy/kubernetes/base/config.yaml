apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-provider-origins
  namespace: email-platform
data:
  mail-allowed-origins: https://mail.example.invalid
  sub2-allowed-origins: https://sub2.example.invalid
  sub2-admin-model-mapping.json: '{"gpt-5.6":"gpt-5.6"}'
