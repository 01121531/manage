              readOnly: true
            - name: internal-tls
              mountPath: /run/secrets/internal-tls/tls.key
              subPath: tls.key
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: internal-ca
          secret:
            secretName: platform-internal-ca
            defaultMode: 288
            items:
              - key: ca.crt
                path: ca.crt
        - name: internal-tls
