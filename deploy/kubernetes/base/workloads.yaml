              subPath: mail-allowed-origins
              readOnly: true
            - name: internal-ca
              mountPath: /run/secrets/internal-tls/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: internal-tls
              mountPath: /run/secrets/internal-tls/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: internal-tls
              mountPath: /run/secrets/internal-tls/tls.key
              subPath: tls.key
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          secret:
            secretName: platform-mail-runtime
            defaultMode: 288
            items:
              - key: database-url
                path: database-url
              - key: vault-token
                path: vault-token
        - name: provider-origins
          configMap:
            name: platform-provider-origins
        - name: internal-ca
          secret:
            secretName: platform-internal-ca
            defaultMode: 288
            items:
              - key: ca.crt
                path: ca.crt
        - name: internal-tls
          secret:
            secretName: platform-worker-mail-internal-tls
            defaultMode: 288
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
