global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: worker-mail
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-mail:9101"]
  - job_name: worker-sub2
    metrics_path: /metrics
    static_configs:
      - targets: ["worker-sub2:9102"]
