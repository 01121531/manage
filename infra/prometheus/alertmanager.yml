# Development/static-test placeholder only: alerts go to a loopback discard
# port and cannot leave the Alertmanager container. Production Compose must
# mount an external configuration and the production preflight rejects this file.
global:
  resolve_timeout: 5m

route:
  receiver: local-placeholder-webhook
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: local-placeholder-webhook
    webhook_configs:
      - url: http://127.0.0.1:9/alerts
        send_resolved: true
